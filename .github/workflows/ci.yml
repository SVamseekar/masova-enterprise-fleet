# Required status check name for branch protection: "test" (job id)
name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**", "docs/**", "test/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is the runtime source of truth; editable install
          # without re-resolving pyproject pins avoids dual-manifest conflicts.
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest pytest-asyncio httpx PyJWT

      - name: Run unit tests (no live LLM/backend)
        env:
          # Dummy keys so Config can load; tools/LLM are mocked in unit tests
          GOOGLE_API_KEY: test-not-a-real-key
          LLM_API_KEY: test-not-a-real-key
          JWT_SECRET: test-secret-at-least-64-characters-long-for-hs512-aaaaaaaaaaaaaaaaaaaaaa
          AGENT_TRIGGER_API_KEY: test-trigger-key
          AGENT_TOKEN: test-agent-token
          BACKEND_URL: http://127.0.0.1:9
        run: |
          python -m pytest tests/ -q --tb=short
