[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masova-agent"
version = "0.1.0"
description = "MaSoVa Customer Support AI Agent built with Google ADK"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "Proprietary"}
authors = [
    {name = "MaSoVa Development Team"}
]
keywords = ["ai", "agent", "customer-support", "google-adk", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Security floor: google-adk <1.28.1 is vulnerable (code injection).
    # Stay on 1.28–1.35 (needs google-genai 1.x); 1.36+ needs genai 2.x.
    "google-adk==1.35.2",
    "google-genai==1.75.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "black>=23.12.1",
    "flake8>=7.3.0",
    "mypy>=1.4.1",
]

[project.scripts]
masova-chat = "masova_agent.chat:main"
masova-test = "masova_agent.test_scenarios:main"

[project.urls]
Homepage = "https://github.com/SVamseekar/masova-enterprise-fleet"
Documentation = "https://github.com/SVamseekar/masova-enterprise-fleet/blob/main/README.md"
Repository = "https://github.com/SVamseekar/masova-enterprise-fleet"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "--ignore=tests/test_scenarios.py"
